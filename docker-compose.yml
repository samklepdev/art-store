services:
  postgres:
    image: postgres:17-alpine
    container_name: art-store-postgres
    restart: unless-stopped
    environment:
      # These match the default DATABASE_URL in .env.example:
      #   postgres://postgres:postgres@localhost:5432/art_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: art_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run on first boot only (when pgdata is empty), in filename order.
      # schema.sql assumes the database already exists — POSTGRES_DB creates it.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d art_store"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
